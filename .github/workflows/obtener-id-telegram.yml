name: Obtener ID de Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obtener-id-telegram
  cancel-in-progress: false

jobs:
  obtener-id:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Esperar comando y responder en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python obtener_chat_id.py
